<!DOCTYPE html>
<html>
<head>
  <title>Clínica Dental</title>
</head>
<body>

<h2>Asistente Clínica Dental</h2>

<div id="chat"></div>

<input id="userInput" placeholder="Ej: ¿Cuánto cuesta un implante?" />
<button onclick="sendMessage()">Enviar</button>

<script>
async function sendMessage() {
  const input = document.getElementById("userInput").value;

  const response = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: input })
  });

  const data = await response.json();

  document.getElementById("chat").innerHTML += "<p><b>Tú:</b> " + input + "</p>";
  document.getElementById("chat").innerHTML += "<p><b>Bot:</b> " + data.reply + "</p>";
}
</script>

</body>
</html>
